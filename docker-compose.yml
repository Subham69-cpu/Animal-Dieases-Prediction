services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/vet_healthcare
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      SECRET_KEY: docker-dev-secret
      JWT_SECRET: docker-dev-jwt
    depends_on:
      - mongo

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:5000
    restart: unless-stopped
    depends_on:
      - api

volumes:
  mongo_data:
